services:
  mysql:
    build:
      context: .
      dockerfile: mysql/Dockerfile
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "70:80"
    volumes:
      - ./web/src:/usr/share/nginx/html
    depends_on:
      - mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge