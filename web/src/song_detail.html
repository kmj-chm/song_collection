<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노래 상세 정보</title>
</head>
<body style="margin: 0; font-family: sans-serif; background-color: #f4f6f9;">

    <nav style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #1e272e; color: white;">
        <h2 style="margin: 0; cursor: pointer;" onclick="location.href='main.html'">🎵 Music Hub</h2>
        <div><button onclick="history.back()" style="background: #555; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">뒤로가기</button></div>
    </nav>

    <div style="max-width: 450px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08);">
        <h2 id="detailTitle" style="margin-top: 0; color: #1e272e; margin-bottom: 5px;">노래 제목</h2>
        <h4 id="detailArtist" style="margin-top: 0; color: #888; font-weight: normal; margin-bottom: 25px;">가수 이름</h4>
        
        <div id="videoContainer" style="margin-bottom: 20px; display: none; width: 100%;">
            <iframe id="youtubePlayer" width="100%" height="250" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border-radius: 6px;"></iframe>
        </div>

        <div style="background: #f9f9f9; padding: 20px; border-radius: 6px; border-left: 5px solid #00d2d3; min-height: 60px; white-space: pre-wrap;">
            <p id="detailDesc" style="margin: 0; line-height: 1.6; color: #444; font-size: 15px;">설명 로딩 중...</p>
        </div>
    </div>

    <script>
        window.onload = function() {
            const currentUser = sessionStorage.getItem("currentUser");
            if (!currentUser) {
                alert("로그인이 필요합니다.");
                location.href = 'login.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const songId = parseInt(urlParams.get('id'), 10);

            const songStorageKey = currentUser + "_mySongs";
            const songs = JSON.parse(localStorage.getItem(songStorageKey)) || [];
            
            const matchedSong = songs.find(s => s.id === songId);

            if (matchedSong) {
                document.getElementById("detailTitle").innerText = matchedSong.title;
                document.getElementById("detailArtist").innerText = matchedSong.artist;
                document.getElementById("detailDesc").innerText = matchedSong.desc;
                document.title = matchedSong.title + " - 상세 정보";

                // 저장된 유튜브 영상 ID가 존재한다면 iframe 주소 연결 후 노출
                if (matchedSong.youtubeId) {
                    const videoContainer = document.getElementById("videoContainer");
                    const player = document.getElementById("youtubePlayer");
                    player.src = `https://www.youtube.com/embed/${matchedSong.youtubeId}`;
                    videoContainer.style.display = "block";
                }
            } else {
                alert("존재하지 않거나 삭제된 노래 정보입니다.");
                location.href = 'main.html';
            }
        };
    </script>
</body>
</html>
